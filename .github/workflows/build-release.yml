name: Build Release APK
run-name: Build ${{ github.ref_name }} - ${{ github.actor }}

on:
  workflow_dispatch:

env:
  CI: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          set -o pipefail

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: List outputs
        run: |
          find app/build/outputs/apk/release -name '*.apk' -exec ls -la {} \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Sesame-AG-release-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
